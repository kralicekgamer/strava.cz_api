[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["strava_cz_api*"]

[project]
name = "strava-cz-api"
version = "3.0.0"
description = "Rest API for strava.cz."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.25",
]
authors = [
  { name="Matěj Adamec", email="kralyk@kralyk.dev" }
]

[project.scripts]
strava-cz = "strava_cz_api.cli:main"
